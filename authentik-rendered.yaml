---
# Source: authentik/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    app.kubernetes.io/name: authentik
---
# Source: authentik/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  selector:
    app: authentik-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Source: authentik/templates/redis.yaml
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  selector:
    app: authentik-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Source: authentik/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: authentik
spec:
  type: ClusterIP
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 9000
      targetPort: http
---
# Source: authentik/templates/authentik-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: authentik
    app.kubernetes.io/managed-by: Helm
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
        app.kubernetes.io/name: authentik
        app.kubernetes.io/instance: authentik
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: authentik-server
          image: "ghcr.io/goauthentik/server:2026.5.3"
          imagePullPolicy: IfNotPresent
          command:
            - ak
            - server
          ports:
            - name: http
              containerPort: 9000

          env:
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis

            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgres

            - name: AUTHENTIK_POSTGRESQL__PORT
              value: "5432"

            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"

            - name: AUTHENTIK_POSTGRESQL__USER
              value: "authentik"

            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: 

          envFrom:
            - secretRef:
                name: authentik-secrets

          readinessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
