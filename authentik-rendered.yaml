---
# Source: authentik/templates/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - redis-server
            - --save
            - "60"
            - "1"
---
# Source: authentik/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      labels:
        app: authentik-postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "authentik"
            - name: POSTGRES_USER
              value: "authentik"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_PASS
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: "5Gi"
---
# Source: authentik/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: authentik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "auth.sesc-it-team.ru"
      secretName: authentik-tls
  rules:
    - host: "auth.sesc-it-team.ru"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 9000
---
# Source: authentik/templates/external-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore

  target:
    name: authentik-secrets
    creationPolicy: Owner

  data:
    - secretKey: PG_PASS
      remoteRef:
        key: apps/authentik
        property: PG_PASS

    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: apps/authentik
        property: PG_PASS

    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: apps/authentik
        property: AUTHENTIK_SECRET_KEY

    - secretKey: AUTHENTIK_ADMIN_EMAIL
      remoteRef:
        key: apps/authentik
        property: AUTHENTIK_ADMIN_EMAIL

    - secretKey: AUTHENTIK_ADMIN_PASSWORD
      remoteRef:
        key: apps/authentik
        property: AUTHENTIK_ADMIN_PASSWORD

    - secretKey: SPRAVKI_CLIENT_ID
      remoteRef:
        key: apps/authentik
        property: SPRAVKI_CLIENT_ID

    - secretKey: SPRAVKI_CLIENT_SECRET
      remoteRef:
        key: apps/authentik
        property: SPRAVKI_CLIENT_SECRET

    - secretKey: SA_SPRAVKI_APP_PASSWORD
      remoteRef:
        key: apps/authentik
        property: SA_SPRAVKI_APP_PASSWORD

    - secretKey: TECHNICAL_SUPPORT_CLIENT_ID
      remoteRef:
        key: apps/authentik
        property: TECHNICAL_SUPPORT_CLIENT_ID

    - secretKey: TECHNICAL_SUPPORT_CLIENT_SECRET
      remoteRef:
        key: apps/authentik
        property: TECHNICAL_SUPPORT_CLIENT_SECRET

    - secretKey: SA_TECHNICAL_SUPPORT_APP_PASSWORD
      remoteRef:
        key: apps/authentik
        property: SA_TECHNICAL_SUPPORT_APP_PASSWORD

    - secretKey: AUTH_ADMIN_APP_CLIENT_ID
      remoteRef:
        key: apps/authentik
        property: AUTH_ADMIN_APP_CLIENT_ID

    - secretKey: AUTH_ADMIN_APP_CLIENT_SECRET
      remoteRef:
        key: apps/authentik
        property: AUTH_ADMIN_APP_CLIENT_SECRET

    - secretKey: SA_AUTH_ADMIN_APP_APP_PASSWORD
      remoteRef:
        key: apps/authentik
        property: SA_AUTH_ADMIN_APP_APP_PASSWORD

    - secretKey: SA_AUTH_ADMIN_APP_API_TOKEN
      remoteRef:
        key: apps/authentik
        property: SA_AUTH_ADMIN_APP_API_TOKEN
