---
- name: Deploy an existing Docker Compose project
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/projects.yml

  pre_tasks:
    - name: Check project_name was passed
      ansible.builtin.assert:
        that:
          - project_name is defined
          - project_name in projects
        fail_msg: >
          Specify a project from vars/projects.yml.
          Example:
          ansible-playbook playbooks/deploy.yml
          -e project_name=lyceum-auth-backend
          -e image_tag=sha-1234567

    - name: Select project configuration
      ansible.builtin.set_fact:
        project: "{{ projects[project_name] }}"

    - name: Check image_tag was passed
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
        fail_msg: "Pass image_tag, for example: -e image_tag=sha-1234567"

    - name: Check deploy directory exists
      ansible.builtin.stat:
        path: "{{ project.deploy_dir }}/docker-compose.yml"
      register: compose_file

    - name: Fail if docker-compose.yml is absent
      ansible.builtin.assert:
        that: compose_file.stat.exists
        fail_msg: >
          File {{ project.deploy_dir }}/docker-compose.yml does not exist.

    - name: Check Docker is available
      ansible.builtin.command: docker info
      changed_when: false

  block:
    - name: Pull exact application image
      ansible.builtin.command:
        cmd: docker compose pull {{ project.service_name }}
        chdir: "{{ project.deploy_dir }}"
      environment:
        "{{ project.image_env_name }}": "127.0.0.1:5000/{{ project_name }}:{{ image_tag }}"
      changed_when: true

    - name: Recreate only application service
      ansible.builtin.command:
        cmd: docker compose up -d --no-build --force-recreate {{ project.service_name }}
        chdir: "{{ project.deploy_dir }}"
      environment:
        "{{ project.image_env_name }}": "127.0.0.1:5000/{{ project_name }}:{{ image_tag }}"
      changed_when: true

    - name: Wait until health endpoint responds
      ansible.builtin.uri:
        url: "{{ project.health_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: healthcheck
      retries: "{{ project.health_retries | default(15) }}"
      delay: "{{ project.health_delay | default(4) }}"
      until: healthcheck.status == 200

  rescue:
    - name: Get Docker Compose status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ project.deploy_dir }}"
      changed_when: false
      register: compose_ps

    - name: Get application logs
      ansible.builtin.command:
        cmd: docker compose logs --tail=150 {{ project.service_name }}
        chdir: "{{ project.deploy_dir }}"
      changed_when: false
      register: application_logs

    - name: Show compose status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines

    - name: Show application logs
      ansible.builtin.debug:
        var: application_logs.stdout_lines

    - name: Mark deployment as failed
      ansible.builtin.fail:
        msg: "Deployment or healthcheck failed: {{ project_name }}"