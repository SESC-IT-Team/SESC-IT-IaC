---
- name: Create Registry data directory
  ansible.builtin.file:
    path: "{{ registry_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure local HTTP Registry for K3s containerd
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      mirrors:
        "{{ registry_host }}":
          endpoint:
            - "http://{{ registry_host }}"

- name: Install K3s when absent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ensure K3s service is started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Install Helm when absent
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install kubernetes Python library via apt (Debian/Ubuntu)
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install kubernetes Python library via yum (RedHat family)
  ansible.builtin.yum:
    name: python3-kubernetes
    state: present
  when: ansible_os_family == "RedHat"

- name: Detect if kubernetes Python library is importable
  ansible.builtin.command: python3 -c "import kubernetes"
  register: kubernetes_py_check
  changed_when: false
  failed_when: false

- name: Fallback - install kubernetes via pip (non-apt-managed OS)
  ansible.builtin.pip:
    name: kubernetes
    state: present
    extra_args: --break-system-packages
  when: kubernetes_py_check.rc != 0

- name: Create kubeconfig directory for deploy user
  ansible.builtin.file:
    path: /home/root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy K3s kubeconfig for deploy user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

# ---------------------------------------------------------------------------
# GitOps source: clone this repo to the server (used for bootstrap manifests)
# ---------------------------------------------------------------------------
- name: Ensure IaC directory parent exists
  ansible.builtin.file:
    path: "{{ iac_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sync IaC repo to server
  ansible.builtin.git:
    repo: "{{ gitops_repo_url }}"
    dest: "{{ iac_dir }}"
    version: "{{ gitops_target_revision }}"
    force: true

# ---------------------------------------------------------------------------
# ArgoCD via Helm
# ---------------------------------------------------------------------------
- name: Wait for K3s API to be ready
  ansible.builtin.shell: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
  register: k3s_ready
  retries: 20
  delay: 3
  until: k3s_ready.rc == 0
  changed_when: false

- name: Add ArgoCD helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
    kubeconfig: /etc/rancher/k3s/k3s.yaml

# ---------------------------------------------------------------------------
# cert-manager: issues the TLS certificate consumed by the ArgoCD Ingress.
# Must be installed before ArgoCD so the Ingress can obtain a cert on boot.
# ---------------------------------------------------------------------------
- name: Add jetstack (cert-manager) helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Find Helm release secrets for cert-manager
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: cert-manager
    label_selectors:
      - owner=helm
      - name=cert-manager
  register: helm_cm_secrets
  failed_when: false

- name: Remove stuck Helm release secrets (anything not in 'deployed' status)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: cert-manager
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ helm_cm_secrets.resources | default([]) }}"
  when: (item.metadata.labels.status | default('')) != 'deployed'
  loop_control:
    label: "{{ item.metadata.name }} [{{ item.metadata.labels.status | default('?') }}]"
  
- name: Install or upgrade cert-manager via Helm
  kubernetes.core.helm:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    values:
      crds:
        enabled: true
      global:
        leaderElection:
          namespace: cert-manager
    wait: true
    wait_timeout: 5m
    atomic: false
    update_repo_cache: true
  environment:
    GODEBUG: http2client=0

- name: Apply LetsEncrypt ClusterIssuer
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          server: "{{ letsencrypt_server }}"
          email: "{{ letsencrypt_email }}"
          privateKeySecretRef:
            name: letsencrypt-prod-account-key
          solvers:
            - http01:
                ingress:
                  class: traefik
    wait: true
    wait_timeout: 180
  environment:
    GODEBUG: http2client=0

- name: Re-check K3s API readiness before ArgoCD install
  ansible.builtin.shell: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
  register: k3s_ready_argocd
  retries: 30
  delay: 5
  until: k3s_ready_argocd.rc == 0
  changed_when: false

- name: Find Helm release secrets for argocd
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: argocd
    label_selectors:
      - owner=helm
      - name=argocd
  register: helm_argocd_secrets
  failed_when: false

- name: Remove stuck Helm release secrets for argocd (anything not in 'deployed' status)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: argocd
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ helm_argocd_secrets.resources | default([]) }}"
  when: (item.metadata.labels.status | default('')) != 'deployed'
  loop_control:
    label: "{{ item.metadata.name }} [{{ item.metadata.labels.status | default('?') }}]"

- name: Install or upgrade ArgoCD via Helm
  kubernetes.core.helm:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    values_files:
      - "{{ iac_dir }}/argocd/values.yaml"
    wait: true
    wait_timeout: 10m
    atomic: false
    update_repo_cache: true
  register: argocd_helm
  retries: 5
  delay: 30
  until: argocd_helm is not failed
  environment:
    GODEBUG: http2client=0

# ---------------------------------------------------------------------------
# App-of-apps bootstrap: project + root Application + child Applications
# ---------------------------------------------------------------------------
- name: Apply ArgoCD AppProject
  ansible.builtin.shell: >
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    apply -f {{ iac_dir }}/argocd/bootstrap/project.yaml
  changed_when: false

- name: Apply ArgoCD Applications (root app-of-apps)
  ansible.builtin.shell: >
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    apply -f {{ iac_dir }}/argocd/bootstrap/root-app.yaml
  changed_when: false

