- name: Backup original sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.backup
    remote_src: yes
    mode: '0644'
  ignore_errors: yes

- name: Copy sshd_config
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
  notify: restart sshd

- name: Ensure zsh is installed
  ansible.builtin.package:
    name: zsh
    state: present
    update_cache: yes

- name: Install zsh-syntax-highlighting
  ansible.builtin.package:
    name: zsh-syntax-highlighting
    state: present
    update_cache: yes

- name: Create users
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: "{{ item.groups }}"
    append: yes
    shell: "{{ item.shell }}"
    create_home: yes
    state: present
    password: "!"
  loop: "{{ users }}"

- name: Create .ssh dir
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: '0700'
  loop: "{{ users }}"

- name: Add ssh keys
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    key: "{{ item.ssh_key }}"
    exclusive: yes
    comment: "{{ item.username }}@ansible"
  loop: "{{ users }}"
  when: item.ssh_key is defined and item.ssh_key != ""

- name: Copy zsh config (default or custom)
  ansible.builtin.copy:
    src: "{{ item.zsh_config | default('default.zsh') }}"
    dest: "/home/{{ item.username }}/.zshrc"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: '0644'
  loop: "{{ users }}"
  when: "'zsh' in item.shell"

- name: Setup passwordless sudo
  ansible.builtin.copy:
    content: "{{ item.username }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ item.username }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ users }}"
  when: item.nopasswd_sudo | default(false)

