apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
              hostPort: 5000

          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry

            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"

          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry

      volumes:
        - name: registry-data
          hostPath:
            path: /opt/registry/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000