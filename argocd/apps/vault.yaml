# ArgoCD Application: Vault (local umbrella over hashicorp/vault).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: default

  source:
    repoURL: https://github.com/SESC-IT-Team/SESC-IT-IaC.git
    targetRevision: env/sescserv
    path: apps/vault
    helm:
      valueFiles:
        - values.yaml
        # Shared cluster settings (global.baseDomain, tlsIssuer) — one place.
        - ../../charts/cluster/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
