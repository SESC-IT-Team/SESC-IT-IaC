apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: default

  sources:
    - repoURL: https://github.com/hashicorp/vault-helm.git
      targetRevision: v0.33.0
      path: .
      helm:
        releaseName: vault
        valueFiles:
          - $values/apps/vault/values.yaml

    - repoURL: https://github.com/SESC-IT-Team/SESC-IT-IaC.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true