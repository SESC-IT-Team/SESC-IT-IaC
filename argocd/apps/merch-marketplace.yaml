# ArgoCD Application: Merch marketplace (Medusa backend + Next.js storefront).
# Source: apps/merch-marketplace/ (Helm chart in this repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: merch-marketplace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/SESC-IT-Team/SESC-IT-IaC.git
    targetRevision: HEAD
    path: apps/merch-marketplace
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: merch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
