apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lyceum-auth
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/SESC-IT-Team/SESC-IT-IaC.git
    targetRevision: env/sescserv
    path: apps/lyceum-auth
    helm:
      valueFiles:
        - values.yaml
        # Shared cluster settings (global.baseDomain, tlsIssuer) — one place.
        - ../../charts/cluster/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: lyceum-auth

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true