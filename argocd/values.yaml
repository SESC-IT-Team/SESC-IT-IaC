# Helm values for argo/argo-cd
# Installed by ansible/roles/k3s_setup/tasks/main.yml
#
# Server: ClusterIP + Ingress on k3s embedded Traefik.
# Hostname / URL are injected by ansible from charts/cluster/values.yaml
# (global.baseDomain → argocd.<baseDomain>).

server:
  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: traefik
    tls: true
    tlsSecretName: argocd-server-tls
    annotations:
      # Bind the router to BOTH `web` (HTTP/80) and `websecure` (HTTPS/443).
      # cert-manager's HTTP-01 challenge from Let's Encrypt arrives on port 80 and must
      # receive a 200 — if only `websecure` is listed, the challenge gets a 404 and hangs.
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      # cert-manager issues the tlsSecretName secret via the letsencrypt-prod ClusterIssuer.
      cert-manager.io/cluster-issuer: letsencrypt-prod
      acme.cert-manager.io/http01-edit-in-place: "true"

  # Give ArgoCD time to settle on a single-node k3s.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10

configs:
  cm:
    # Repository is public, no credentials needed.
    repositories: |
      - name: sesc-it-iac
        url: https://github.com/SESC-IT-Team/SESC-IT-IaC.git
        type: git

  params:
    # Terminate TLS at Traefik (the Ingress serves the letsencrypt cert from
    # argocd-server-tls). ArgoCD itself speaks plain HTTP behind the Ingress.
    server.insecure: true

# Single-node k3s: be conservative with resources.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
