services:
  registry:
    image: registry:3
    container_name: sesc-docker-registry
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    volumes:
      - ./data:/var/lib/registry