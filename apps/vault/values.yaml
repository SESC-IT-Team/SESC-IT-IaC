global:
  enabled: true
  tlsDisable: true

vault:
  fullnameOverride: vault

  server:
    image:
      repository: hashicorp/vault

    ha:
      enabled: true
      replicas: 1

      disruptionBudget:
        enabled: false

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path    = "/vault/data"
            node_id = "vault-0"
          }

          # Transit auto-unseal via vault-unsealer (argocd/apps/vault-unsealer.yaml).
          # TRANSIT_ADDR / TRANSIT_TOKEN are substituted from env at pod start.
          seal "transit" {
            address          = "TRANSIT_ADDR"
            token            = "TRANSIT_TOKEN"
            key_name         = "autounseal"
            mount_path       = "transit/"
            disable_renewal  = "false"
          }

          service_registration "kubernetes" {}

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: local-path

    auditStorage:
      enabled: true
      size: 5Gi
      storageClass: local-path

    extraEnvironmentVars:
      TRANSIT_ADDR: "http://vault-unsealer.vault.svc.cluster.local:8200"

    # Transit client token for the seal (Secret created by
    # scripts/sescserv/vault-transit.sh; the pod cannot start without it).
    extraSecretEnvironmentVars:
      - envName: TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    readinessProbe:
      enabled: true
      timeoutSeconds: 10
      failureThreshold: 5
      periodSeconds: 10
      initialDelaySeconds: 5

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

    ingress:
      enabled: false

  ui:
    enabled: true
    serviceType: ClusterIP

  injector:
    enabled: false

hostPrefix: vault
tlsSecretName: vault-tls
