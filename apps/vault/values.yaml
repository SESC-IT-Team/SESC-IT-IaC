global:
  enabled: true
  tlsDisable: true

vault:
  fullnameOverride: vault

  server:
    image:
      repository: hashicorp/vault

    ha:
      enabled: true
      replicas: 1

      disruptionBudget:
        enabled: false

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path    = "/vault/data"
            node_id = "vault-0"
          }

          service_registration "kubernetes" {}

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: local-path

    auditStorage:
      enabled: true
      size: 5Gi
      storageClass: local-path

    readinessProbe:
      enabled: true
      timeoutSeconds: 10
      failureThreshold: 5
      periodSeconds: 10
      initialDelaySeconds: 5

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

    ingress:
      enabled: false

  ui:
    enabled: true
    serviceType: ClusterIP

  injector:
    enabled: false

hostPrefix: vault
tlsSecretName: vault-tls
