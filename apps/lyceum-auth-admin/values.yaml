namespace: lyceum-auth-admin

frontendHostPrefix: admin
tlsSecretName: lyceum-auth-admin-tls

frontend:
  global:
    internalCA:
      enabled: true
      configMapName: sesc-internal-ca
      mountPath: /etc/ssl/certs/sesc-internal-ca.crt

  image:
    repository: lyceum-auth-admin-frontend
    tag: "796fb2a"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 4173
  env:
    VITE_AUTH_PATH: /auth
    VITE_AUTH_CALLBACK_PATH: /auth/callback
    VITE_AUTH_SCOPES: openid profile offline_access auth:users:read auth:users:create auth:users:update auth:users:delete
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

backend:
  image:
    repository: lyceum-auth-admin-backend
    tag: "89b39fb"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 5000
  healthPath: /health
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

externalSecret:
  enabled: true
  name: lyceum-auth-admin-secrets
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  remoteRef:
    key: apps/lyceum-auth-admin
  # Keys are intentionally configurable: Vault remains the source of secret values.
  data:
    - secretKey: ALLOWED_ISSUERS
      property: ALLOWED_ISSUERS
    - secretKey: AUTHENTIK_URL
      property: AUTHENTIK_URL
    - secretKey: APPLICATION_SLUG
      property: APPLICATION_SLUG
    - secretKey: CLIENT_ID
      property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      property: CLIENT_SECRET
    - secretKey: LOGIN_REDIRECT_URI
      property: LOGIN_REDIRECT_URI
    - secretKey: COOKIE_SECURE
      property: COOKIE_SECURE
    - secretKey: ROUTER_PATH
      property: ROUTER_PATH
    - secretKey: USER_SERVICE_URL
      property: USER_SERVICE_URL