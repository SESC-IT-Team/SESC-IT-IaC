apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyceum-auth-admin-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lyceum-auth-admin-backend
  template:
    metadata:
      labels:
        {{- include "lyceum-auth-admin.labels" . | nindent 8 }}
        app.kubernetes.io/name: lyceum-auth-admin-backend
    spec:
      containers:
        - name: backend
          image: {{ include "lyceum-auth-admin.image" (dict "image" .Values.backend.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ .Values.externalSecret.name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lyceum-auth-admin-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lyceum-auth-admin-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http