apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyceum-auth-admin-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lyceum-auth-admin-backend
  template:
    metadata:
      labels:
        {{- include "lyceum-auth-admin.labels" . | nindent 8 }}
        app.kubernetes.io/name: lyceum-auth-admin-backend
    spec:
      containers:
        - name: backend
          image: {{ include "lyceum-auth-admin.image" (dict "image" .Values.backend.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: ALLOWED_ORIGINS
              value: {{ list (include "cluster.url" (dict "ctx" . "prefix" .Values.frontendHostPrefix)) | toJson | quote }}
            - name: COOKIE_DOMAIN
              value: {{ printf ".%s" (include "cluster.fqdn" (dict "ctx" . "prefix" .Values.frontendHostPrefix)) | quote }}
            - name: AUTHENTIK_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix) | quote }}
            - name: APPLICATION_SLUG
              value: {{ .Values.auth.applicationSlug | quote }}
            - name: ALLOWED_ISSUERS
              value: {{ list (printf "%s/application/o/%s/" (include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix)) .Values.auth.applicationSlug) | toJson | quote }}
            - name: LOGIN_REDIRECT_URI
              value: {{ printf "%s/auth/callback" (include "cluster.url" (dict "ctx" . "prefix" .Values.frontendHostPrefix)) | quote }}
            - name: COOKIE_SECURE
              value: "true"
            - name: ROUTER_PATH
              value: "/auth"
            - name: USER_SERVICE_URL
              value: {{ include "cluster.apiUrl" (dict "ctx" . "prefix" "users") | quote }}
            - name: SEND_ACCESS_TOKEN_IN_JSON_RESPONSE
              value: "false"
            - name: SEND_ACCESS_TOKEN_AS_COOKIE
              value: "true"
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
          envFrom:
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ .Values.externalSecret.name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lyceum-auth-admin-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lyceum-auth-admin-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http