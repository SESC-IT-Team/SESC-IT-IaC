apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyceum-auth-admin-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lyceum-auth-admin-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lyceum-auth-admin-frontend
        {{- include "lyceum-auth-admin.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "lyceum-auth-admin.image" (dict "image" .Values.frontend.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lyceum-auth-admin-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lyceum-auth-admin-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http