apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyceum-auth-admin-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lyceum-auth-admin-frontend
  template:
    metadata:
      labels:
        {{- include "lyceum-auth-admin.labels" . | nindent 8 }}
        app.kubernetes.io/name: lyceum-auth-admin-frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "lyceum-auth-admin.image" (dict "image" .Values.frontend.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: DOMAIN
              value: {{ include "cluster.fqdn" (dict "ctx" . "prefix" .Values.frontendHostPrefix) | quote }}
            - name: VITE_DOMAIN
              value: {{ printf "https://%s" (include "cluster.fqdn" (dict "ctx" . "prefix" .Values.frontendHostPrefix)) | quote }}
            - name: VITE_AUTH_DOMAIN
              value: {{ printf "https://%s" (include "lyceum-auth-admin.apiFqdn" (dict "ctx" . "prefix" .Values.frontendHostPrefix)) | quote }}
            {{- range $name, $value := .Values.frontend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lyceum-auth-admin-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lyceum-auth-admin.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lyceum-auth-admin-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http