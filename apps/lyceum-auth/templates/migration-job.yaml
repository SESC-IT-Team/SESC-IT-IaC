{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lyceum-auth.fullname" . }}-migrate
  labels:
    {{- include "lyceum-auth.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "lyceum-auth.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -ec
            - |
              uv run --no-sync alembic upgrade head
          envFrom:
            - configMapRef:
                name: {{ include "lyceum-auth.fullname" . }}-config
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}