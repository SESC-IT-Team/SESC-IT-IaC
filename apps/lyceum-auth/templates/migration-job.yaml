{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lyceum-auth.fullname" . }}-migrate
  labels:
    {{- include "lyceum-auth.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "lyceum-auth.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h {{ .Values.config.postgres.host | default (printf "%s-postgresql.%s.svc.cluster.local" (include "lyceum-auth.fullname" .) .Release.Namespace) | quote }} -p {{ .Values.config.postgres.port | quote }}; do sleep 2; done
      containers:
        - name: migration
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -ec
            - |
              uv run --no-sync alembic upgrade head
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "lyceum-auth.fullname" . }}-config
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
{{- end }}