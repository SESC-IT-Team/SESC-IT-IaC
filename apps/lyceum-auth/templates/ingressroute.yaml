{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "lyceum-auth.fullname" . }}
  labels:
    {{- include "lyceum-auth.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`/`)
      services:
        - name: {{ include "lyceum-auth.fullname" . }}
          port: 8000
  tls:
    secretName: {{ .Values.ingressRoute.tlsSecretName }}
{{- end }}