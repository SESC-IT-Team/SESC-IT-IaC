apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lyceum-auth.fullname" . }}
  labels:
    {{- include "lyceum-auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lyceum-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lyceum-auth.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lyceum-auth.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth-api
          image: {{ include "lyceum-auth.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.config.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.config.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.postgres.user | quote }}
            - name: ROOT_PATH
              value: "/"
            - name: USERS_PATH
              value: "users"
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
          startupProbe:
            {{- if .Values.probes.startup.enabled }}
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            {{- end }}
          livenessProbe:
            {{- if .Values.probes.liveness.enabled }}
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            {{- end }}
          readinessProbe:
            {{- if .Values.probes.readiness.enabled }}
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: jwt-keys
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-jwt-keys" (include "lyceum-auth.fullname" .)) .Values.persistence.jwtKeys.existingClaim }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
