apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lyceum-auth.fullname" . }}
  labels:
    {{- include "lyceum-auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lyceum-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lyceum-auth.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lyceum-auth.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "lyceum-auth.postgresHost" . | quote }} -p {{ .Values.config.postgres.port | quote }}; do
                sleep 2;
              done
      containers:
        - name: auth-api
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - bash
            - -ec
            - |
              echo "POSTGRES_HOST=${POSTGRES_HOST:-unset}"
              if [ "{{ .Values.migration.enabled }}" = "true" ]; then
                uv run --no-sync alembic upgrade head
              fi
              exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetSecretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              value: {{ include "lyceum-auth.postgresHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.config.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.postgres.user | quote }}
            - name: ROOT_PATH
              value: "/"
            - name: USERS_PATH
              value: "users"
          envFrom:
            - configMapRef:
                name: {{ include "lyceum-auth.fullname" . }}-config
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
            - name: jwt-keys
              mountPath: /app/keys
          startupProbe:
            {{- if .Values.probes.startup.enabled }}
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            {{- end }}
          livenessProbe:
            {{- if .Values.probes.liveness.enabled }}
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            {{- end }}
          readinessProbe:
            {{- if .Values.probes.readiness.enabled }}
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
        - name: jwt-keys
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-jwt-keys" (include "lyceum-auth.fullname" .)) .Values.persistence.jwtKeys.existingClaim }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
