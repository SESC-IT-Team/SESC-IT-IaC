replicaCount: 1

image:
  repository: lyceum-auth-backend
  tag: "5fc4947"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

externalSecret:
  enabled: true
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  remoteRef:
    key: apps/lyceum-auth
  targetSecretName: lyceum-auth-secrets
  refreshInterval: 1h

config:
  postgres:
    host: lyceum-auth-postgresql
    port: "5432"
    database: lyceum_auth
    user: lyceum_auth

  envFilePath: ".env"
  rootPath: "/"

  adminLogin: admin

  usersPath: users

  allowedIssuerAppSlugs:
    - spravki-app
    - technical-support-app
    - auth-admin-app

hostPrefix: users
authentikHostPrefix: auth

certificate:
  enabled: true
  issuerRef:
    name: sesc-internal-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: lyceum-auth-tls
  duration: 2160h
  renewBefore: 360h

ingressRoute:
  enabled: true
  entryPoints:
    - websecure
  tlsSecretName: lyceum-auth-tls

postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  persistence:
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  jwtKeys:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
