namespace: document-renderer

global:
  internalCA:
    enabled: true
    configMapName: sesc-internal-ca
    mountPath: /etc/ssl/certs/sesc-internal-ca.crt

image:
  repository: document-renderer
  tag: "f4ab7b4"
  pullPolicy: IfNotPresent

rabbitmq:
  host: rabbitmq.rabbitmq.svc.cluster.local
  port: 5672

redis:
  host: redis.redis.svc.cluster.local
  port: 6379
  db: 0

s3:
  scheme: https
  hostPrefix: s3
  port: 9000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
