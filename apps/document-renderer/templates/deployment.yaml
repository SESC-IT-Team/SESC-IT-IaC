apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-renderer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: document-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-renderer
  template:
    metadata:
      labels:
        app: document-renderer
    spec:
      containers:
        - name: document-renderer
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uv
            - run
            - taskiq
            - worker
            - --log-level=INFO
            - src.tasks:broker
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DB
              value: {{ .Values.redis.db | quote }}
            - name: S3_URL
              value: {{ printf "%s://%s" .Values.s3.scheme (include "cluster.fqdn" (dict "ctx" . "prefix" .Values.s3.hostPrefix)) | quote }}
            - name: S3_PORT
              value: {{ .Values.s3.port | quote }}
          envFrom:
            - secretRef:
                name: document-renderer-secrets
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
