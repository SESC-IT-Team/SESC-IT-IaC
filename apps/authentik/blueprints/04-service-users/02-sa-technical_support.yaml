version: 1
metadata:
  name: Service User - Technical Support

entries:
  - model: authentik_core.user
    identifiers:
      username: sa-technical-support
    attrs:
      name: "Spravki Service User"
      type: service_account
      path: "goauthentik.io/service-accounts"
      groups:
        - !Find [authentik_core.group, [name, openfga-allowed]]

  - model: authentik_core.token
    identifiers:
      identifier: sa-technical-support-app-password
    attrs:
      user: !Find [authentik_core.user, [username, sa-technical-support]]
      intent: app_password
      description: "App Password for Technical Support Service User"
      expiring: false
      key: !Env SA_TECHNICAL_SUPPORT_APP_PASSWORD