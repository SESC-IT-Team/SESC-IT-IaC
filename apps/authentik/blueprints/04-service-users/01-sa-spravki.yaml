version: 1
metadata:
  name: Service User - Spravki

entries:
  - model: authentik_core.user
    identifiers:
      username: sa-spravki
    attrs:
      name: "Spravki Service User"
      type: service_account
      path: "goauthentik.io/service-accounts"
      groups:
        - !Find [authentik_core.group, [name, openfga-allowed]]

  - model: authentik_core.token
    identifiers:
      identifier: sa-spravki-app-password
    attrs:
      user: !Find [authentik_core.user, [username, sa-spravki]]
      intent: app_password
      description: "App Password for Spravki Service User"
      expiring: false
      key: !Env SA_SPRAVKI_APP_PASSWORD