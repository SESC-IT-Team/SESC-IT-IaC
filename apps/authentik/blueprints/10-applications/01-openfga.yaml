version: 1
metadata:
  name: "OpenFGA Service Client Credentials Only"
  context:
    labels:
      blueprint_v1_v1_bootstrap: "true" 
entries:
  # 1. Провайдер с поддержкой ТОЛЬКО Client Credentials
  - identifiers:
      name: "openfga-provider"
    model: authentik_providers_oauth2.oauth2provider
    attrs:
      sub_mode: "user_uuid" 
      issuer_mode: "per_provider"
      
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_credentials_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      
      client_type: "confidential"
      client_id: !Env OPENFGA_CLIENT_ID
      client_secret: !Env OPENFGA_CLIENT_SECRET
      grant_types:
        - "client_credentials"
      
      
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
      
      redirect_uris: []

  - identifiers:
      slug: "openfga-app"
    model: authentik_core.application
    attrs:
      name: "OpenFGA"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "openfga-provider"]]
      meta_hide: true

  - identifiers:
      target: !Find [authentik_core.application, [slug, "openfga-app"]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "policy-check-openfga-group"]]
    model: authentik_policies.policybinding
    attrs:
      order: 0
      enabled: true