apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "blueprints/**.yaml" }}
  {{ $path | trimPrefix "blueprints/" | replace "/" "__" }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}