namespace: authentik

image:
  repository: ghcr.io/goauthentik/server
  tag: "2026.5.3"
  pullPolicy: IfNotPresent

hostPrefix: auth

postgres:
  image: postgres:16-alpine
  database: authentik
  user: authentik
  storage:
    size: 5Gi
    storageClass: local-path

redis:
  image: redis:7-alpine

authentik:
  serverReplicas: 1
  workerReplicas: 1
  errorReportingEnabled: false
  adminEmail: admin@example.com
  clients:
    spravki:
      clientId: spravki-client-id
    technicalSupport:
      clientId: technical-support-client-id
    authAdmin:
      clientId: auth-admin-client-id
    openfga:
      clientId: openfga-client-id
  resources:
    server:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    worker:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

global:
  envFrom:
    - secretRef:
        name: authentik-secrets

