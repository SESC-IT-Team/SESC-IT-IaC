apiVersion: v1
kind: Service
metadata:
  name: technical-support-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: technical-support-backend
spec:
  type: ClusterIP
  selector:
    app: technical-support-backend
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
