apiVersion: apps/v1
kind: Deployment
metadata:
  name: technical-support-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: technical-support-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technical-support-backend
  template:
    metadata:
      labels:
        app: technical-support-backend
    spec:
      containers:
        - name: technical-support-backend
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - uv run alembic upgrade head && uv run python -m src.main
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: POSTGRES_HOST
              value: technical-support-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: ROOT_PATH
              value: {{ .Values.rootPath | quote }}
            - name: AUTH_BASE_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix) | quote }}
            - name: AUTHENTIK_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix) | quote }}
            - name: INTERNAL_AUTHENTIK_URL
              value: http://authentik-server.authentik.svc.cluster.local:9000
            - name: APPLICATION_SLUG
              value: {{ .Values.auth.applicationSlug | quote }}
            - name: ALLOWED_APPLICATION_SLUGS
              value: {{ .Values.auth.allowedApplicationSlugs | toJson | quote }}
            - name: USER_SERVICE_URL
              value: http://lyceum-auth.lyceum-auth.svc.cluster.local:8000
            - name: SEND_ACCESS_TOKEN_IN_JSON_RESPONSE
              value: "false"
            - name: SEND_ACCESS_TOKEN_AS_COOKIE
              value: "true"
            - name: ROUTER_PATH
              value: {{ .Values.auth.routerPath | quote }}
            - name: ALLOWED_ISSUERS
              value: {{ list (printf "%s/application/o/%s/" (include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix)) .Values.auth.applicationSlug) | toJson | quote }}
            - name: DOMAIN
              value: {{ include "cluster.fqdn" (dict "ctx" . "prefix" .Values.hostPrefix) | quote }}
            - name: API_DOMAIN
              value: {{ include "cluster.apiFqdn" (dict "ctx" . "prefix" .Values.hostPrefix) | quote }}
            - name: COOKIE_DOMAIN
              value: {{ printf ".%s" (include "cluster.fqdn" (dict "ctx" . "prefix" .Values.hostPrefix)) | quote }}
            - name: COOKIE_SECURE
              value: "true"
            - name: COOKIE_SAMESITE
              value: "lax"
            - name: S3_ENDPOINT_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.s3.hostPrefix) | quote }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.s3.accessKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: technical-support-backend-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              value: {{ .Values.s3.bucketName | quote }}
            - name: S3_REGION_NAME
              value: {{ .Values.s3.region | quote }}
            - name: CLIENT_ID
              value: {{ .Values.auth.clientId | quote }}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: technical-support-backend-secrets
                  key: CLIENT_SECRET
            - name: LOGIN_REDIRECT_URI
              value: {{ printf "%s/auth/callback" (include "cluster.apiUrl" (dict "ctx" . "prefix" .Values.hostPrefix)) | quote }}
          envFrom:
            - secretRef:
                name: technical-support-backend-secrets
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
