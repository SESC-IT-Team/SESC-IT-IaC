namespace: technical-support

global:
  internalCA:
    enabled: true
    configMapName: sesc-internal-ca
    mountPath: /etc/ssl/certs/sesc-internal-ca.crt

image:
  repository: technical-support-backend
  tag: "7463090"
  pullPolicy: IfNotPresent

hostPrefix: support
tlsSecretName: technical-support-backend-tls

port: 8123

rootPath: /

postgres:
  image: postgres:16-alpine
  database: technical_support
  user: techsupport
  storage:
    size: 5Gi
    storageClass: local-path

# Order photos in the cluster MinIO (public endpoint so presigned URLs work
# in the browser). The bucket must exist.
s3:
  hostPrefix: s3
  accessKey: minioadmin
  bucketName: order-photos
  region: us-east-1

auth:
  hostPrefix: auth
  applicationSlug: technical-support-app
  # Must match authentik.clients.technicalSupport.clientId.
  clientId: technical-support-client-id
  routerPath: ""
  allowedApplicationSlugs:
    - technical-support-app

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
