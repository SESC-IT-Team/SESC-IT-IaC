apiVersion: v1
kind: Service
metadata:
  name: merch-backend
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: merch-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merch-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: merch-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merch-backend
  template:
    metadata:
      labels:
        app: merch-backend
    spec:
      containers:
        - name: merch-backend
          image: {{ include "merch.image" (dict "ctx" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: NODE_ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: merch-marketplace-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: merch-marketplace-secrets
                  key: REDIS_PASSWORD
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@merch-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@merch-redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: merch-marketplace-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: merch-marketplace-secrets
                  key: COOKIE_SECRET
            - name: STORE_CORS
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.hostPrefix) | quote }}
            - name: ADMIN_CORS
              value: {{ include "cluster.apiUrl" (dict "ctx" . "prefix" .Values.apiHostPrefix) | quote }}
            - name: AUTH_CORS
              value: {{ printf "%s,%s" (include "cluster.url" (dict "ctx" . "prefix" .Values.hostPrefix)) (include "cluster.apiUrl" (dict "ctx" . "prefix" .Values.apiHostPrefix)) | quote }}
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
