apiVersion: v1
kind: Service
metadata:
  name: merch-redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: merch-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: merch-redis
  namespace: {{ .Values.namespace }}
spec:
  serviceName: merch-redis
  replicas: 1
  selector:
    matchLabels:
      app: merch-redis
  template:
    metadata:
      labels:
        app: merch-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: merch-marketplace-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --pass $REDIS_PASSWORD ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --pass $REDIS_PASSWORD ping | grep PONG
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.redis.storage.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storage.size | quote }}
