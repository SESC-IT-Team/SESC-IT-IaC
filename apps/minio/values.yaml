namespace: minio

# Upstream MinIO no longer publishes images (quay.io/minio/minio and
# docker.io/minio/minio deny anonymous pulls); use the frozen Bitnami build.
image: bitnamilegacy/minio:2025.7.23-debian-12-r5
# Bypass the Bitnami entrypoint so `args` go straight to the minio binary.
command:
  - minio
podSecurityContext:
  fsGroup: 1001

apiHostPrefix: s3
consoleHostPrefix: minio
rootUser: minioadmin

apiPort: 9000
consolePort: 9001

tlsSecretName: minio-tls

storage:
  size: 10Gi
  storageClass: local-path

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
