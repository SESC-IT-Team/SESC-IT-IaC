apiVersion: batch/v1
kind: Job
metadata:
  name: sesc-portal-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sesc-portal
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h sesc-portal-postgres -p 5432; do sleep 2; done
      containers:
        - name: migrate
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [".venv/bin/python", "scripts/migrate_db.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sesc-portal-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sesc-portal-secrets
                  key: SECRET_KEY