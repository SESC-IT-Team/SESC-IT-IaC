apiVersion: apps/v1
kind: Deployment
metadata:
  name: spravki-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: spravki-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spravki-backend
  template:
    metadata:
      labels:
        app: spravki-backend
    spec:
      containers:
        - name: spravki-backend
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            {{- include "cluster.internalCAEnv" . | nindent 12 }}
            - name: POSTGRES_HOST
              value: spravki-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: ROOT_PATH
              value: {{ .Values.rootPath | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ list (include "cluster.url" (dict "ctx" . "prefix" .Values.hostPrefix)) | toJson | quote }}
            - name: COOKIE_DOMAIN
              value: {{ printf ".%s" (include "cluster.fqdn" (dict "ctx" . "prefix" .Values.hostPrefix)) | quote }}
            - name: AUTH_BASE_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix) | quote }}
            - name: AUTHENTIK_URL
              value: {{ include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix) | quote }}
            - name: APPLICATION_SLUG
              value: {{ .Values.auth.applicationSlug | quote }}
            - name: ALLOWED_ISSUERS
              value: {{ list (printf "%s/application/o/%s/" (include "cluster.url" (dict "ctx" . "prefix" .Values.auth.hostPrefix)) .Values.auth.applicationSlug) | toJson | quote }}
            - name: ROUTER_PATH
              value: {{ .Values.auth.routerPath | quote }}
            - name: SEND_ACCESS_TOKEN_IN_JSON_RESPONSE
              value: "false"
            - name: SEND_ACCESS_TOKEN_AS_COOKIE
              value: "true"
            - name: USER_SERVICE_URL
              value: {{ include "cluster.apiUrl" (dict "ctx" . "prefix" "users") | quote }}
            - name: RABBITMQ_HOST
              value: {{ .Values.renderer.rabbitmqHost | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.renderer.rabbitmqPort | quote }}
            - name: S3_URL
              value: {{ .Values.renderer.s3Url | quote }}
            - name: S3_PORT
              value: {{ .Values.renderer.s3Port | quote }}
          envFrom:
            - secretRef:
                name: spravki-backend-secrets
          volumeMounts:
            {{- include "cluster.internalCAMount" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "cluster.internalCAVolume" . | nindent 8 }}
