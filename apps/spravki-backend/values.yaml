namespace: spravki

global:
  internalCA:
    enabled: true
    configMapName: sesc-internal-ca
    mountPath: /etc/ssl/certs/sesc-internal-ca.crt

image:
  repository: spravki-backend
  tag: "115ec98"
  pullPolicy: IfNotPresent

hostPrefix: spravki
tlsSecretName: spravki-backend-tls

port: 8000

# FastAPI root_path: empty, the backend is served on its own subdomain
rootPath: /

postgres:
  image: postgres:16-alpine
  database: certificates
  user: spravki
  storage:
    size: 5Gi
    storageClass: local-path

auth:
  hostPrefix: auth
  applicationSlug: spravki-app
  allowedIssuers:
    - https://auth.sesc-it-team.ru/application/o/spravki-app/
  routerPath: ""

userServiceUrl: https://users.sesc-it-team.ru

# document-renderer-sdk client endpoints (in-cluster)
renderer:
  rabbitmqHost: rabbitmq.rabbitmq.svc.cluster.local
  rabbitmqPort: 5672
  s3Url: minio.minio.svc.cluster.local
  s3Port: 9000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
