apiVersion: apps/v1
kind: Deployment
metadata:
  name: spravki-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: spravki-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spravki-frontend
  template:
    metadata:
      labels:
        app: spravki-frontend
    spec:
      containers:
        - name: spravki-frontend
          image: {{ include "cluster.privateImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
