# Values for the private Docker registry.
# Used by ArgoCD Application argocd/apps/registry.yaml.
#
# Secure mode:
#   - external access via https://reg.<baseDomain> (Traefik Ingress + LetsEncrypt)
#   - basic auth (htpasswd) from Vault kv/apps/registry
#   - containerd keeps pulling via hostPort mirror http://127.0.0.1:5000
cleanup:
  enabled: true
  protectedTagPatterns:
    - '^latest$'
    - '^main$'
    - '^master$'
    - '^prod$'
    - '^release-.*$'
    - '^v[0-9]+(\.[0-9]+){0,2}$'

  keepLast: 15
  maxAgeDays: 30
  schedule: "15 03 * * *"
  garbageCollectSchedule: "30 03 * * *"
  registryURL: http://registry:5000
  kubectlImage: rancher/kubectl:v1.31.4
  retentionImage: python:3.12-alpine
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
image:
  repository: registry
  tag: "3"
  pullPolicy: IfNotPresent

replicas: 1

securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Keep the host binding so containerd (registries.yaml -> 127.0.0.1:5000) can pull
# without auth and without leaving the host.
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

service:
  port: 5000

ports:
  containerPort: 5000
  hostPort: 5000

ingress:
  tlsSecretName: registry-tls

# Enable htpasswd auth (requires kv/apps/registry:HTPASSWD in Vault).
auth:
  enabled: false
  realm: "SESC-IT Registry"

storage:
  rootDirectory: /var/lib/registry
  deleteEnabled: true
  hostPath: /opt/registry/data
  hostPathType: DirectoryOrCreate

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# End of registry values.









