# Values for the private Docker registry.
# Used by ArgoCD Application argocd/apps/registry.yaml.
#
# Secure mode:
#   - external access via https://reg.<baseDomain> (Traefik Ingress + LetsEncrypt)
#   - basic auth (htpasswd) from Vault kv/apps/registry
#   - registry is exposed through the in-cluster Service and Ingress
cleanup:
  enabled: true
  protectedTagPatterns:
    - '^latest$'
    - '^main$'
    - '^master$'
    - '^prod$'
    - '^release-.*$'
    - '^v[0-9]+(\.[0-9]+){0,2}$'

  keepLast: 15
  maxAgeDays: 30
  schedule: "15 03 * * *"
  garbageCollectSchedule: "30 03 * * *"
  registryURL: http://registry:5000
  kubectlImage: bitnamilegacy/kubectl:1.31.4
  retentionImage: python:3.12-alpine
  # Created by templates/external-secret.yaml when auth.enabled is true.
  existingSecret: registry-htpasswd
  usernameKey: username
  passwordKey: password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
image:
  repository: registry
  tag: "3"
  pullPolicy: IfNotPresent

replicas: 1

securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

service:
  port: 5000

ports:
  containerPort: 5000

ingress:
  tlsSecretName: registry-tls

# htpasswd auth: the registry is reachable from the internet.
# Requires kv/apps/registry: HTPASSWD, REGISTRY_USERNAME, REGISTRY_PASSWORD.
# Nodes pull with the same credentials via /etc/rancher/k3s/registries.yaml.
auth:
  enabled: true
  realm: "SESC-IT Registry"

storage:
  rootDirectory: /var/lib/registry
  deleteEnabled: true
  hostPath: /opt/registry/data
  hostPathType: DirectoryOrCreate

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# End of registry values.









