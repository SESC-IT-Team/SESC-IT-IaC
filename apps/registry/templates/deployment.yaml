apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      containers:
        - name: registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.containerPort }}
              hostPort: {{ .Values.ports.hostPort }}
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: {{ .Values.storage.rootDirectory | quote }}
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: {{ .Values.storage.deleteEnabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: {{ .Values.auth.realm | quote }}
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            {{- end }}
          {{- if .Values.auth.enabled }}
          volumeMounts:
            - name: registry-data
              mountPath: {{ .Values.storage.rootDirectory }}
            - name: auth
              mountPath: /auth
              readOnly: true
          {{- else }}
          volumeMounts:
            - name: registry-data
              mountPath: {{ .Values.storage.rootDirectory }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: registry-data
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: {{ .Values.storage.hostPathType }}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: registry-htpasswd
            items:
              - key: HTPASSWD
                path: htpasswd
        {{- end }}
